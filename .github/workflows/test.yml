name: Test

# Jest. A pull request runs the tests that the changed files reach (--changedSince the base
# branch, through the import graph), so the check stays short; a change to the setup, the
# dependencies or the config runs the whole suite, as main always does.
# Not in ghcr.yml's gate: a separate check, which branch protection can require later.
on:
  pull_request:
    paths-ignore: ['docs/**', '**/*.md']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: '0'
    steps:
      - uses: actions/checkout@v4
        with:
          # --changedSince needs the base branch's history
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Jest
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [[ $EVENT == pull_request ]]; then
            # Setup, dependencies and config reach every test: then the whole suite
            if git diff --name-only "origin/$BASE...HEAD" |
              grep -qE '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|jest\.config\.cjs|tsconfig\.json|src/test/setup/)'; then
              pnpm exec jest --ci
            else
              pnpm exec jest --ci --changedSince="origin/$BASE"
            fi
          else
            pnpm exec jest --ci
          fi
